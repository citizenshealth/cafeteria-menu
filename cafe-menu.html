<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    display: flex;

    min-height: 100vh;
  }

  .header {
    background: var(--charcoal);

    text-transform: uppercase;
    color: #aaa;
    margin-top: 5px;
  }

  .header-info { text-align: right; }

  .header-date {

    letter-spacing: 0.04em;
  }

  .header-clock {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 50px;
    font-weight: 700;
    line-height: 1;
    margin-top: 2px;
  }

  /* MEAL BANNER */

    font-size: 17px;
    letter-spacing: 0.25em;
    text-transform: uppercase;

  .meal-banner.lunch     { background: var(--banner-lunch); }
  .meal-banner.closed    { background: #555; }

  /* MAIN */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 20px 80px 14px;
    overflow: hidden;
  }

    font-size: 84px;
    font-weight: 800;
    font-style: normal;
    color: #222222;
    margin-bottom: 16px;
    line-height: 1;
  }

  .menu-columns {
    display: flex;
    flex-direction: column;
    flex: 1;
    max-width: 1400px;
  }

  .menu-column {
    display: flex;
    flex-direction: column;
  }

  .col-heading {
    font-size: 20px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--light-gray);
    font-weight: 600;
    padding-bottom: 14px;
    border-bottom: 3px solid #64c2dc;
    margin-bottom: 0;
  }

  /* MENU ROW */
  .menu-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 18px 0;
    border-bottom: 1px dotted #ccc;
    gap: 16px;
  }

  .menu-row:last-child {
    border-bottom: 1px dotted #ccc;
  }

  .row-left {
    flex: 1;
    min-width: 0;
  }

  .row-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 56px;
    font-weight: 700;
    font-style: normal;
    color: #000000;
    line-height: 1.1;
  }

  .row-desc {
    font-size: 32px;
    color: var(--muted);
    margin-top: 2px;
  }

  .row-right {
    display: flex;
    align-items: baseline;
    gap: 18px;
    flex-shrink: 0;

    font-size: 62px;
    font-weight: 800;

    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;

  }

// ============================================================
// DATE & TIME LOGIC
// ============================================================

// Week 1 anchor: The Monday of the current week 1.
// Today is Tuesday March 18, 2026 = Week 1, Tuesday
// Tuesday June 30 2026 = Week 1 Tuesday, so Monday of that week = June 29 2026
const WEEK1_MONDAY = new Date(2026, 5, 29); // June 29, 2026 (month is 0-indexed)

function getWeekAndDay(now) {
  const msPerDay = 86400000;
  const dayOfWeek = now.getDay(); // 0=Sun, 1=Mon...5=Fri, 6=Sat

  // Find Monday of the current week
  const daysFromMonday = dayOfWeek === 0 ? 6 : dayOfWeek - 1;
  const thisMonday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - daysFromMonday);

  const diffMs = thisMonday - WEEK1_MONDAY;
  const diffWeeks = Math.floor(diffMs / (7 * msPerDay));
  const weekNum = ((diffWeeks % 4) + 4) % 4 + 1; // 1–4, cycling

  // dayNum: 1=Mon, 2=Tue, 3=Wed, 4=Thu, 5=Fri
  const dayNum = dayOfWeek === 0 ? 0 : dayOfWeek; // 0 = Sunday/weekend

  return { weekNum, dayNum };
}

function getMealType(now) {
  const h = now.getHours();
  const m = now.getMinutes();
  const totalMin = h * 60 + m;
  const breakfastDisplay = 7 * 60;       // 7:00 AM — start showing breakfast
  const breakfastEnd     = 9 * 60 + 30;  // 9:30 AM — breakfast ends
  const lunchPreview     = 9 * 60 + 30;  // 9:30 AM — start showing lunch
  const lunchEnd         = 13 * 60 + 30; // 1:30 PM — lunch ends

  if (totalMin >= breakfastDisplay && totalMin < breakfastEnd) return 'breakfast';
  if (totalMin >= lunchPreview && totalMin < lunchEnd) return 'lunch';
  return 'closed';
}

function getServiceStatus(now) {
  const totalMin = now.getHours() * 60 + now.getMinutes();
  if (totalMin >= 7 * 60 && totalMin < 7 * 60 + 45) return 'breakfast-preview';
  if (totalMin >= 7 * 60 + 45 && totalMin < 9 * 60 + 30) return 'breakfast-open';
  if (totalMin >= 9 * 60 + 30 && totalMin < 11 * 60 + 30) return 'lunch-preview';
  if (totalMin >= 11 * 60 + 30 && totalMin < 13 * 60 + 30) return 'lunch-open';
  return 'closed';
}

const DAY_NAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function formatTime(now) {
  let h = now.getHours();
  const m = String(now.getMinutes()).padStart(2, '0');
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return `${h}:${m} ${ampm}`;
}

function buildColumns(items, showFootnote) {
  const heading = showFootnote
    ? `<div class="col-heading" style="border-bottom-color: #bb1a00; color: #bb1a00; font-style: italic; font-size: 22px; letter-spacing: 0.02em; text-transform: none; line-height: 1.3;">New pricing as of 6/30/26 · Associates receive discount at the register</div>`
    : `<div class="col-heading">Today's Selections</div>`;
  return `
    <div class="menu-column">
      ${heading}
      ${items.map(rowHTML).join('')}
    </div>
  `;
}

function rowHTML(item) {
  let priceDisplay = '';
  let calDisplay = '';
  if (item.price) {
    const parts = item.price.split('·');
    priceDisplay = parts[0].trim().replace('$', '').trim();
    if (parts[1]) calDisplay = parts[1].trim().replace(' cal', '') + ' cal';
  }
  return `
    <div class="menu-row">
      <div class="row-left">
        <div class="row-name">${item.name}</div>
        ${item.meta ? `<div class="row-desc">${item.meta}</div>` : ''}
      </div>
      <div class="row-right">
        ${calDisplay ? `<span class="row-cal">${calDisplay}</span>` : ''}
        ${priceDisplay ? `<span class="row-price">${priceDisplay}</span>` : ''}
      </div>
    </div>
  `;
}

function closedHTML(title, msg, hours) {
  return `
    <div class="closed-state">
      <div class="closed-title">${title}</div>
      ${msg ? `<div class="closed-msg">${msg}</div>` : ''}
      ${hours ? `<div class="closed-hours">${hours}</div>` : ''}
    </div>
  `;
}
